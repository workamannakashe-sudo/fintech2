name: Build & Release BudgetMitra APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Copy Assets to Android App
        run: |
          mkdir -p app/src/main/assets/public
          cp -r dist/* app/src/main/assets/public/

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -l debug.keystore

      - name: Build Debug APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-configuration-cache

      - name: Locate and Rename APK
        run: |
          mkdir -p build-artifacts
          APK=$(find . -name "*-debug.apk" -type f | head -n 1)
          echo "Found APK: $APK"
          if [ -z "$APK" ]; then
            echo "No debug APK found"
            exit 1
          fi
          cp "$APK" build-artifacts/BudgetMitra.apk
          ls -lh build-artifacts

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudgetMitra-APK
          path: build-artifacts/BudgetMitra.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: BudgetMitra APK (Latest Build)
          body: Debug APK built from commit ${{ github.sha }}
          files: build-artifacts/BudgetMitra.apk
          draft: false
          prerelease: false
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
